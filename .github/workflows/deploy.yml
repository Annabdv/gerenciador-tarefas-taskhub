name: Deploy na Produção

on:
  push:
    branches:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH Nativo
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

          echo "${{ github.actor }}:$TOKEN" | ssh -o StrictHostKeyChecking=no $USER@$HOST "cd ~/atividade2-crud-anna.alves || cd /home/$USER/atividade2-crud-anna.alves && git checkout main && git pull && docker compose down && docker compose up --build -d"