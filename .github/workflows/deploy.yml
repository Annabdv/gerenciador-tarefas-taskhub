name: Deploy na Produção

on:
  push:
    branches:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy via SSH no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd ~/atividade2-crud-anna.alves || cd /home/${{ secrets.SERVER_USER }}/atividade2-crud-anna.alves
            git checkout main
            git pull
            docker compose down
            docker compose up --build -d