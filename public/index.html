<!DOCTYPE html>
<html lang="pt-BR">
<!-- versão 1309 -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NODE — Notes, Organize, Do, Execute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Italiana&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            brand: ['"Italiana"', 'serif'],
          },
          colors: {
            brand: {
              bg: '#DEBCBF',
              card: '#F5E6E8',
              border: '#D19BA4',
              primary: '#C07A86',
              hover: '#B57778',
              accent: '#915156',
              soft: '#E7D3D7',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #DEBCBF;
      min-height: 100vh;
    }

    .fade-in {
      animation: fadeIn 0.25s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body
  class="font-sans text-gray-800 antialiased selection:bg-brand-border selection:text-white min-h-screen flex flex-col">

  <!-- Toast Notification -->
  <div id="toast"
    class="fixed top-5 right-5 z-50 transform transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none max-w-sm w-full">
    <div id="toast-content" class="rounded-xl p-4 shadow-xl border flex items-center gap-3 bg-brand-card text-gray-800">
      <span id="toast-icon" class="text-xl"></span>
      <p id="toast-message" class="text-sm font-medium flex-1"></p>
    </div>
  </div>

  <!-- MODAL DE EDIÇÃO DA TAREFA -->
  <div id="modal-edit"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm hidden p-4">
    <div class="bg-brand-card border-2 border-brand-border rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl fade-in">
      <h3 class="text-lg font-bold text-brand-accent mb-4">Editar Tarefa</h3>
      <form id="form-edit-tarefa" onsubmit="handleSaveEditTask(event)" class="space-y-4">
        <input type="hidden" id="edit-tarefa-id">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Título *</label>
          <input type="text" id="edit-tarefa-titulo" required
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Prazo / Data Limite
            (Opcional)</label>
          <input type="datetime-local" id="edit-tarefa-data"
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Descrição</label>
          <textarea id="edit-tarefa-descricao" rows="3"
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeEditModal()"
            class="px-4 py-2.5 rounded-xl border border-brand-border text-gray-700 hover:bg-brand-soft text-sm font-semibold transition-all">
            Cancelar
          </button>
          <button type="submit" id="btn-salvar-edit"
            class="px-5 py-2.5 rounded-xl bg-brand-primary hover:bg-brand-hover text-white text-sm font-semibold shadow-md transition-all">
            Salvar Alterações
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- AUTH CONTAINER (Login & Cadastro) -->
  <div id="auth-section" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-brand-card border-2 border-brand-border rounded-3xl shadow-xl w-full max-w-md p-8 sm:p-10 fade-in">
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-soft border border-brand-border text-brand-accent mb-3 shadow-inner">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <h1 class="font-brand text-4xl font-extrabold text-brand-accent tracking-wider">NODE</h1>
        <p class="text-xs font-semibold uppercase tracking-widest text-brand-primary mt-1">Notes, Organize, Do, Execute
        </p>
        <p class="text-[11px] text-gray-400 mt-0.5">Gerenciador de Tarefas</p>
      </div>

      <div class="flex rounded-xl bg-brand-soft p-1 mb-6">
        <button id="tab-login" onclick="switchAuthTab('login')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-brand-card text-brand-accent shadow-sm">
          Entrar
        </button>
        <button id="tab-register" onclick="switchAuthTab('register')"
          class="flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-brand-accent">
          Cadastrar
        </button>
      </div>

      <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com"
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Senha</label>
          <input type="password" id="login-senha" required placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <button type="submit" id="btn-login-submit"
          class="w-full py-3.5 px-4 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-semibold shadow-md hover:shadow-lg transition-all transform active:scale-[0.99] mt-2">
          Entrar na Conta
        </button>
      </form>

      <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Nome Completo</label>
          <input type="text" id="reg-nome" required placeholder="Seu nome"
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">E-mail</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com"
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Senha</label>
          <input type="password" id="reg-senha" required placeholder="Mínimo 6 caracteres"
            class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <button type="submit" id="btn-reg-submit"
          class="w-full py-3.5 px-4 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-semibold shadow-md hover:shadow-lg transition-all transform active:scale-[0.99] mt-2">
          Criar Minha Conta
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD CONTAINER -->
  <div id="dashboard-section" class="hidden flex-1 flex flex-col">
    <header class="bg-brand-card border-b-2 border-brand-border shadow-sm sticky top-0 z-40">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-xl bg-brand-soft border border-brand-border text-brand-accent flex items-center justify-center font-bold text-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
          </div>
          <div>
            <h1 class="font-brand text-2xl font-bold text-brand-accent leading-none">NODE</h1>
            <p class="text-[10px] font-semibold uppercase tracking-wider text-brand-primary mt-0.5">Notes, Organize, Do,
              Execute — Gerenciador de Tarefas</p>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div class="flex items-center gap-2 bg-brand-soft px-3.5 py-1.5 rounded-full border border-brand-border">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
            <span id="user-display-name" class="text-sm font-semibold text-brand-accent">Usuário</span>
          </div>
          <button onclick="handleLogout()" title="Sair da conta"
            class="p-2 rounded-xl text-gray-500 hover:text-brand-accent hover:bg-brand-soft border border-transparent hover:border-brand-border transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-6">

      <!-- Cards de Estatísticas -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div
          class="bg-brand-card border-2 border-brand-border rounded-2xl p-5 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Total de Tarefas</p>
            <p id="stat-total" class="text-3xl font-extrabold text-brand-accent mt-1">0</p>
          </div>
          <div class="w-12 h-12 rounded-xl bg-brand-soft flex items-center justify-center text-brand-accent">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
          </div>
        </div>

        <div
          class="bg-brand-card border-2 border-brand-border rounded-2xl p-5 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Pendentes</p>
            <p id="stat-pendentes" class="text-3xl font-extrabold text-brand-primary mt-1">0</p>
          </div>
          <div class="w-12 h-12 rounded-xl bg-brand-soft flex items-center justify-center text-brand-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>

        <div
          class="bg-brand-card border-2 border-brand-border rounded-2xl p-5 shadow-sm flex items-center justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Concluídas</p>
            <p id="stat-concluidas" class="text-3xl font-extrabold text-emerald-600 mt-1">0</p>
          </div>
          <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Formulário de Nova Tarefa -->
      <div class="bg-brand-card border-2 border-brand-border rounded-3xl p-6 sm:p-8 shadow-sm">
        <h2 class="text-lg font-bold text-brand-accent mb-4 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-brand-primary" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Criar Nova Tarefa
        </h2>

        <form id="form-nova-tarefa" onsubmit="handleCreateTask(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Título *</label>
              <input type="text" id="tarefa-titulo" required placeholder="Ex: Finalizar relatório..."
                class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Prazo / Data Limite
                (Opcional)</label>
              <input type="datetime-local" id="tarefa-data"
                class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-1">Descrição</label>
              <input type="text" id="tarefa-descricao" placeholder="Detalhes opcionais..."
                class="w-full px-4 py-3 rounded-xl border border-brand-border bg-brand-soft/30 focus:bg-brand-card focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
            </div>
          </div>
          <div class="flex justify-end mt-2">
            <button type="submit" id="btn-criar-tarefa"
              class="px-6 py-3 rounded-xl bg-brand-primary hover:bg-brand-hover text-white font-semibold shadow-md hover:shadow-lg transition-all transform active:scale-95 text-sm">
              Adicionar Tarefa
            </button>
          </div>
        </form>
      </div>

      <!-- Lista de Tarefas -->
      <div class="bg-brand-card border-2 border-brand-border rounded-3xl p-6 sm:p-8 shadow-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <h2 class="text-lg font-bold text-brand-accent">Minhas Tarefas</h2>

          <div class="flex flex-wrap items-center gap-3">
            <div class="inline-flex rounded-xl bg-brand-soft p-1 text-xs font-semibold border border-brand-border">
              <button onclick="setViewMode('lista')" id="view-lista"
                class="px-3 py-1.5 rounded-lg bg-brand-card text-brand-accent shadow-sm">Lista</button>
              <button onclick="setViewMode('grade')" id="view-grade"
                class="px-3 py-1.5 rounded-lg text-gray-600 hover:text-brand-accent">Grade por Mês</button>
            </div>

            <div class="inline-flex rounded-xl bg-brand-soft p-1 text-xs font-semibold">
              <button onclick="setFilter('todas')" id="filter-todas"
                class="px-3 py-1.5 rounded-lg bg-brand-card text-brand-accent shadow-sm">Todas</button>
              <button onclick="setFilter('pendentes')" id="filter-pendentes"
                class="px-3 py-1.5 rounded-lg text-gray-600 hover:text-brand-accent">Pendentes</button>
              <button onclick="setFilter('concluidas')" id="filter-concluidas"
                class="px-3 py-1.5 rounded-lg text-gray-600 hover:text-brand-accent">Concluídas</button>
            </div>
          </div>
        </div>

        <div id="lista-tarefas"></div>

        <div id="empty-state" class="hidden text-center py-12">
          <div
            class="w-16 h-16 rounded-full bg-brand-soft text-brand-primary flex items-center justify-center mx-auto mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h3 class="text-base font-semibold text-brand-accent">Nenhuma tarefa encontrada</h3>
          <p class="text-sm text-gray-500 mt-1">Você está em dia com suas atividades!</p>
        </div>
      </div>

    </main>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    let tarefas = [];
    let currentFilter = 'todas';
    let currentViewMode = 'lista';

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastContent = document.getElementById('toast-content');
      const toastIcon = document.getElementById('toast-icon');
      const toastMessage = document.getElementById('toast-message');

      toastMessage.textContent = message;
      if (type === 'success') {
        toastContent.className = 'rounded-xl p-4 shadow-xl border flex items-center gap-3 bg-brand-card border-emerald-300 text-emerald-900';
        toastIcon.textContent = '✓';
      } else {
        toastContent.className = 'rounded-xl p-4 shadow-xl border flex items-center gap-3 bg-brand-card border-rose-300 text-rose-900';
        toastIcon.textContent = '✕';
      }

      toast.classList.remove('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-[-20px]', 'pointer-events-none');
      }, 3500);
    }

    function switchAuthTab(tab) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (tab === 'login') {
        tabLogin.className = 'flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-brand-card text-brand-accent shadow-sm';
        tabRegister.className = 'flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-brand-accent';
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      } else {
        tabRegister.className = 'flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-brand-card text-brand-accent shadow-sm';
        tabLogin.className = 'flex-1 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-brand-accent';
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    }

    function checkAuth() {
      const token = localStorage.getItem('token');
      const userStr = localStorage.getItem('usuario');

      const authSection = document.getElementById('auth-section');
      const dashboardSection = document.getElementById('dashboard-section');

      if (token && userStr) {
        try {
          const user = JSON.parse(userStr);
          document.getElementById('user-display-name').textContent = user.nome || 'Usuário';
          authSection.classList.add('hidden');
          dashboardSection.classList.remove('hidden');
          loadTasks();
        } catch (e) {
          handleLogout();
        }
      } else {
        authSection.classList.remove('hidden');
        dashboardSection.classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Falha no login');

        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));

        showToast(`Bem-vindo(a), ${data.usuario.nome}!`);
        document.getElementById('form-login').reset();
        checkAuth();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar na Conta';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const nome = document.getElementById('reg-nome').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const senha = document.getElementById('reg-senha').value;
      const btn = document.getElementById('btn-reg-submit');

      btn.disabled = true;
      btn.textContent = 'Criando conta...';

      try {
        const res = await fetch('/api/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Falha no cadastro');

        showToast('Conta criada com sucesso! Faça login.');
        document.getElementById('form-register').reset();
        switchAuthTab('login');
        document.getElementById('login-email').value = email;
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Criar Minha Conta';
      }
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      tarefas = [];
      showToast('Sessão encerrada.');
      checkAuth();
    }

    function getAuthHeaders() {
      const token = localStorage.getItem('token');
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/tarefas', { headers: getAuthHeaders() });

        if (res.status === 401 || res.status === 403) {
          handleLogout();
          return;
        }

        tarefas = await res.json();
        renderTasks();
      } catch (err) {
        showToast('Erro ao carregar tarefas', 'error');
      }
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const tituloInput = document.getElementById('tarefa-titulo');
      const descInput = document.getElementById('tarefa-descricao');
      const dataInput = document.getElementById('tarefa-data');
      const btn = document.getElementById('btn-criar-tarefa');

      const titulo = tituloInput.value.trim();
      const descricao = descInput.value.trim();
      const data_vencimento = dataInput.value ? new Date(dataInput.value).toISOString() : null;

      if (!titulo) return;

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        const res = await fetch('/api/tarefas', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ titulo, descricao, data_vencimento })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Erro ao criar tarefa');

        await loadTasks();
        tituloInput.value = '';
        descInput.value = '';
        dataInput.value = '';
        showToast('Tarefa criada com sucesso!');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Adicionar Tarefa';
      }
    }

    // LÓGICA DE EDIÇÃO DE TAREFA (MODAL)
    function openEditModal(id) {
      const tarefa = tarefas.find(t => t.id === id);
      if (!tarefa) return;

      document.getElementById('edit-tarefa-id').value = tarefa.id;
      document.getElementById('edit-tarefa-titulo').value = tarefa.titulo;
      document.getElementById('edit-tarefa-descricao').value = tarefa.descricao || '';

      if (tarefa.data_vencimento) {
        const d = new Date(tarefa.data_vencimento);
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        document.getElementById('edit-tarefa-data').value = d.toISOString().slice(0, 16);
      } else {
        document.getElementById('edit-tarefa-data').value = '';
      }

      document.getElementById('modal-edit').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('modal-edit').classList.add('hidden');
    }

    async function handleSaveEditTask(e) {
      e.preventDefault();
      const id = document.getElementById('edit-tarefa-id').value;
      const titulo = document.getElementById('edit-tarefa-titulo').value.trim();
      const descricao = document.getElementById('edit-tarefa-descricao').value.trim();
      const dataRaw = document.getElementById('edit-tarefa-data').value;
      const data_vencimento = dataRaw ? new Date(dataRaw).toISOString() : null;
      const btn = document.getElementById('btn-salvar-edit');

      btn.disabled = true;

      try {
        const res = await fetch(`/api/tarefas/${id}`, {
          method: 'PUT',
          headers: getAuthHeaders(),
          body: JSON.stringify({ titulo, descricao, data_vencimento })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Erro ao salvar alterações');

        closeEditModal();
        await loadTasks();
        showToast('Tarefa atualizada com sucesso!');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function toggleTaskStatus(id, currentStatus) {
      try {
        const res = await fetch(`/api/tarefas/${id}`, {
          method: 'PUT',
          headers: getAuthHeaders(),
          body: JSON.stringify({ concluida: !currentStatus })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Erro ao atualizar tarefa');

        await loadTasks();
        showToast(data.concluida ? 'Tarefa concluída!' : 'Tarefa reaberta!');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    async function deleteTask(id) {
      if (!confirm('Deseja realmente excluir esta tarefa?')) return;

      try {
        const res = await fetch(`/api/tarefas/${id}`, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.erro || 'Erro ao excluir tarefa');

        await loadTasks();
        showToast('Tarefa excluída!');
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['todas', 'pendentes', 'concluidas'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = 'px-3 py-1.5 rounded-lg bg-brand-card text-brand-accent shadow-sm';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg text-gray-600 hover:text-brand-accent';
        }
      });
      renderTasks();
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('view-lista').className = mode === 'lista' ? 'px-3 py-1.5 rounded-lg bg-brand-card text-brand-accent shadow-sm' : 'px-3 py-1.5 rounded-lg text-gray-600 hover:text-brand-accent';
      document.getElementById('view-grade').className = mode === 'grade' ? 'px-3 py-1.5 rounded-lg bg-brand-card text-brand-accent shadow-sm' : 'px-3 py-1.5 rounded-lg text-gray-600 hover:text-brand-accent';
      renderTasks();
    }

    function renderTasks() {
      const container = document.getElementById('lista-tarefas');
      const emptyState = document.getElementById('empty-state');

      const total = tarefas.length;
      const concluidas = tarefas.filter(t => t.concluida).length;
      const pendentes = total - concluidas;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-pendentes').textContent = pendentes;
      document.getElementById('stat-concluidas').textContent = concluidas;

      let filtradas = tarefas;
      if (currentFilter === 'pendentes') filtradas = tarefas.filter(t => !t.concluida);
      if (currentFilter === 'concluidas') filtradas = tarefas.filter(t => t.concluida);

      if (filtradas.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      if (currentViewMode === 'lista') {
        container.className = 'space-y-3';
        container.innerHTML = filtradas.map(task => renderTaskItem(task)).join('');
      } else {
        container.className = 'space-y-8';
        container.innerHTML = renderGridByMonth(filtradas);
      }
    }

    function renderTaskItem(task) {
      const dataCriacao = new Date(task.criado_em).toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      let prazoTexto = '';
      if (task.data_vencimento) {
        prazoTexto = new Date(task.data_vencimento).toLocaleDateString('pt-BR', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      }

      return `
        <div class="group flex items-start justify-between gap-4 p-4 rounded-2xl border transition-all duration-200 ${task.concluida
          ? 'bg-brand-soft/30 border-brand-border/50 opacity-75'
          : 'bg-brand-card border-brand-border hover:border-brand-accent hover:shadow-md'
        }">
          <div class="flex items-start gap-3 flex-1 min-w-0">
            <button 
              onclick="toggleTaskStatus(${task.id}, ${task.concluida})" 
              title="${task.concluida ? 'Marcar como pendente' : 'Marcar como concluída'}"
              class="mt-1 w-6 h-6 rounded-lg border flex items-center justify-center transition-all ${task.concluida
          ? 'bg-brand-primary border-brand-primary text-white'
          : 'border-brand-border hover:border-brand-accent bg-brand-card'
        }">
              ${task.concluida ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>' : ''}
            </button>

            <div class="flex-1 min-w-0">
              <h4 class="font-semibold text-sm ${task.concluida ? 'line-through text-gray-500' : 'text-gray-900'} truncate">
                ${escapeHtml(task.titulo)}
              </h4>
              ${task.descricao ? `<p class="text-xs text-gray-500 mt-0.5 break-words">${escapeHtml(task.descricao)}</p>` : ''}
              
              <div class="flex flex-wrap items-center gap-2 mt-2 text-[11px]">
                <span class="inline-flex items-center gap-1 font-medium px-2 py-0.5 rounded-full ${task.concluida ? 'bg-emerald-100 text-emerald-700' : 'bg-brand-soft text-brand-accent'
        }">
                  ${task.concluida ? 'Concluída' : 'Pendente'}
                </span>
                <span class="text-gray-400">•</span>
                <span class="text-gray-500" title="Data em que a tarefa foi salva no sistema">Cadastrado: ${dataCriacao}</span>
                ${prazoTexto ? `
                  <span class="text-gray-400">•</span>
                  <span class="font-semibold text-brand-primary" title="Prazo final informado">Prazo: 📅 ${prazoTexto}</span>
                ` : ''}
              </div>
            </div>
          </div>

          <div class="flex items-center gap-1">
            <button 
              onclick="openEditModal(${task.id})" 
              title="Editar tarefa"
              class="p-2 text-gray-400 hover:text-brand-accent hover:bg-brand-soft rounded-xl transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </button>

            <button 
              onclick="deleteTask(${task.id})" 
              title="Excluir tarefa"
              class="p-2 text-gray-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>
      `;
    }

    function renderGridByMonth(lista) {
      const grupos = {};

      lista.forEach(t => {
        const dataRef = t.data_vencimento || t.criado_em;
        const dataObj = new Date(dataRef);
        const chaveMes = dataObj.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

        if (!grupos[chaveMes]) grupos[chaveMes] = [];
        grupos[chaveMes].push(t);
      });

      return Object.entries(grupos).map(([mes, tarefasDoMes]) => `
        <div>
          <h3 class="text-md font-bold text-brand-accent capitalize border-b-2 border-brand-border pb-1 mb-3">${mes}</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${tarefasDoMes.map(t => renderTaskItem(t)).join('')}
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>

</html>
